; The export to one standalone executable, pibridge-world (Godot's Linux release template with the project embedded):
; what the package ships, so no Godot is needed to run the world. CMake -DPIBRIDGE_EXPORT_WORLD=ON runs it
; (docs/world.md); the export templates of the same Godot version must be installed on the build machine.
[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
