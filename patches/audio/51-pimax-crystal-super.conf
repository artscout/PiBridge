# omarchyvr: Pimax Crystal Super USB audio. Its speakers are ALSA device 1 (hw:Super,1, S16_LE 2ch 48 kHz) and its
# microphone device 0; the stock analog profiles only probe device 0 for output, so they offer the microphone only.
# The pro-audio profile opens both devices: use it by default and give the nodes plain names.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Pimax_Corporation_Pimax_Crystal_Super.*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        device.description = "Pimax Crystal Super"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Pimax_Corporation_Pimax_Crystal_Super.*" }
    ]
    actions = {
      update-props = {
        node.description = "Pimax Crystal Super (headset speakers)"
        node.nick = "Pimax Crystal Super"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Pimax_Corporation_Pimax_Crystal_Super.*" }
    ]
    actions = {
      update-props = {
        node.description = "Pimax Crystal Super (headset microphone)"
        node.nick = "Pimax Crystal Super mic"
      }
    }
  }
]
